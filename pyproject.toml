[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-mcp"
version = "1.0.0"
description = "SSH broker MCP server: credentials stay server-side, clients only pass aliases"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3",
    "paramiko>=3.4",
    "PyYAML>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ssh-mcp = "ssh_mcp.__main__:main"
ssh-mcp-desktop = "ssh_mcp.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssh_mcp = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
